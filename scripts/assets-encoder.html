<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>media-player · 本地素材编码（离线）</title>
  </head>
  <body>
    <pre id="status">编码中…</pre>
    <script>
      // 用浏览器自带的 VideoEncoder 产出真实 H.264 样本，POST 回本机 Node 服务。
      // 全程 127.0.0.1，无外网请求；素材内容为通用虚构图形。
      const statusEl = document.getElementById('status')
      const say = (s) => (statusEl.textContent = s + '\n' + statusEl.textContent)

      const q = new URLSearchParams(location.search)
      const W = Number(q.get('w') ?? 160)
      const H = Number(q.get('h') ?? 90)
      const FPS = Number(q.get('fps') ?? 8)
      const FRAMES = Number(q.get('frames') ?? 10)
      const CHANNELS = Number(q.get('channels') ?? 6)
      const BITRATE = Number(q.get('bitrate') ?? 220000)

      // 与 scripts/gen-assets.mjs 保持一致的调色板（通用色块，不含语义）
      const PALETTES = [
        ['#0c4a6e', '#38bdf8'],
        ['#115e59', '#2dd4bf'],
        ['#4c1d95', '#a78bfa'],
        ['#7c2d12', '#fb923c'],
        ['#1e293b', '#94a3b8'],
        ['#713f12', '#fde047'],
      ]

      const lerp = (a, b, t) => a + (b - a) * t
      const mix = (c0, c1, t) => {
        const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]
        const a = p(c0)
        const b = p(c1)
        return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`
      }

      function draw(ctx, ch, f) {
        const t = f / FRAMES
        const [c0, c1] = PALETTES[ch % PALETTES.length]
        // 对角渐变（用 8 段近似，编码器友好）
        for (let y = 0; y < H; y += 6) {
          for (let x = 0; x < W; x += 8) {
            ctx.fillStyle = mix(c0, c1, (x / W + y / H) / 2)
            ctx.fillRect(x, y, 8, 6)
          }
        }
        // 网格
        ctx.fillStyle = 'rgba(226,232,240,0.35)'
        for (let x = 0; x < W; x += 20) ctx.fillRect(x, 0, 1, H)
        for (let y = 0; y < H; y += 20) ctx.fillRect(0, y, W, 1)
        // 运动方块（水平往返）
        const phase = t < 0.5 ? t * 2 : (1 - t) * 2
        const bx = Math.round(lerp(4, W - 28, phase))
        ctx.fillStyle = '#ffffff'
        ctx.fillRect(bx, H / 2 - 12, 24, 24)
        ctx.fillStyle = '#111827'
        ctx.fillRect(bx + 3, H / 2 - 9, 18, 18)
        // 进度条
        ctx.fillStyle = '#0f172a'
        ctx.fillRect(0, H - 8, W, 6)
        ctx.fillStyle = '#38bdf8'
        ctx.fillRect(0, H - 8, Math.round(W * t), 6)
      }

      function b64(u8) {
        let s = ''
        const CH = 0x8000
        for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH))
        return btoa(s)
      }

      async function encodeChannel(ch) {
        const chunks = []
        let description = null
        let keyFlags = []
        const enc = new VideoEncoder({
          output: (chunk, meta) => {
            if (meta && meta.decoderConfig && meta.decoderConfig.description && !description) {
              description = new Uint8Array(meta.decoderConfig.description)
            }
            const buf = new Uint8Array(chunk.byteLength)
            chunk.copyTo(buf)
            chunks.push(buf)
            keyFlags.push(chunk.type === 'key')
          },
          error: (e) => {
            throw new Error('VideoEncoder: ' + e)
          },
        })
        enc.configure({
          codec: 'avc1.42001f',
          width: W,
          height: H,
          bitrate: BITRATE,
          framerate: FPS,
          latencyMode: 'realtime',
          avc: { format: 'avc' }, // 输出 AVCC（长度前缀）样本，由 Node 侧封装 mp4
        })
        const canvas = new OffscreenCanvas(W, H)
        const ctx = canvas.getContext('2d')
        for (let f = 0; f < FRAMES; f++) {
          draw(ctx, ch, f)
          const frame = new VideoFrame(canvas, {
            timestamp: Math.round((f * 1e6) / FPS),
            duration: Math.round(1e6 / FPS),
          })
          enc.encode(frame, { keyFrame: f % 8 === 0 })
          frame.close()
        }
        await enc.flush()
        enc.close()
        return { chunks, description, keyFlags }
      }

      async function main() {
        try {
          if (typeof VideoEncoder === 'undefined') throw new Error('本环境无 VideoEncoder')
          const channels = []
          for (let ch = 0; ch < CHANNELS; ch++) {
            say('编码通道 ' + (ch + 1) + '/' + CHANNELS)
            const r = await encodeChannel(ch)
            channels.push({
              width: W,
              height: H,
              fps: FPS,
              avcC: b64(r.description ?? new Uint8Array()),
              samples: r.chunks.map(b64),
              keyFlags: r.keyFlags,
            })
            // 每完成一路就回传一次：服务端据此提前结束等待（不必等浏览器退出）
            await fetch('/__progress', { method: 'POST', body: String(ch + 1) })
          }
          const res = await fetch('/__assets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ channels }),
          })
          say('已提交：HTTP ' + res.status + ' ' + (await res.text()))
          document.title = 'DONE'
        } catch (e) {
          say('失败：' + e)
          try {
            await fetch('/__assets', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ error: String(e && e.stack ? e.stack : e) }),
            })
          } catch (_) {
            /* 忽略 */
          }
          document.title = 'FAILED'
        }
      }
      main()
    </script>
  </body>
</html>
