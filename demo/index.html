<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>media-player · 独立示例（零外网）</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #e5e7eb;
        font: 13px/1.6 system-ui, 'Segoe UI', sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-height: 0;
      }
      header {
        padding: 8px 12px;
        border-bottom: 1px solid #1f2937;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      header .hint {
        color: #9ca3af;
      }
      header button,
      header select {
        font: inherit;
        color: inherit;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 3px;
        padding: 2px 8px;
        cursor: pointer;
      }
      main {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 300px;
      }
      #stage {
        min-width: 0;
        min-height: 0;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #player {
        flex: 1 1 auto;
        min-height: 0;
      }
      aside {
        border-left: 1px solid #1f2937;
        padding: 8px 10px;
        overflow: auto;
        font-size: 12px;
      }
      aside h2 {
        font-size: 12px;
        text-transform: none;
        color: #9ca3af;
        margin: 12px 0 4px;
      }
      #events {
        white-space: pre-wrap;
        word-break: break-all;
        color: #93c5fd;
        max-height: 40vh;
        overflow: auto;
        margin: 0;
      }
      #summary {
        white-space: pre-wrap;
        margin: 0;
        color: #d1d5db;
      }
      #empty-note {
        display: none;
        padding: 16px;
        border: 1px dashed #374151;
        border-radius: 4px;
        color: #9ca3af;
      }
      .warn {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
